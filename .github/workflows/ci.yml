name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Checkout clickhouse-cpp
        run: |
          git submodule sync --recursive
          for attempt in 1 2 3; do
            if git submodule update --init --force --depth=1 --recursive; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          git submodule update --init --force --depth=1 --recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: phpize
          coverage: none

      - name: Install C/C++ tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format clang-tidy

      - name: Check C/C++ formatting
        run: |
          git ls-files '*.cpp' '*.h' \
            | grep -Ev '^(clickhouse-cpp|build)/' \
            | grep -Ev '^(clickhouse_arginfo.h|src/error_codes.cpp)$' \
            | xargs clang-format --dry-run --Werror

      - name: Run clang-tidy
        run: |
          phpize
          ./configure --enable-clickhouse
          php_includes="$(php-config --includes)"
          common_args="-std=c++17 -DHAVE_CONFIG_H=1 -DZEND_ENABLE_STATIC_TSRMLS_CACHE=1 \
            -DCH_USE_ABSEIL_FOR_BIGNUM=1 -DCH_MAP_BOOL_TO_UINT8=0 -DCH_NON_OPTIONAL_CURRENT_ENDPOINT=0 \
            -I. -Iclickhouse-cpp -Iclickhouse-cpp/contrib/absl \
            -Iclickhouse-cpp/clickhouse/cityhash -Iclickhouse-cpp/contrib/lz4/lz4 \
            -Iclickhouse-cpp/contrib/zstd/zstd $php_includes"
          git ls-files '*.cpp' \
            | grep -Ev '^(clickhouse-cpp|build)/' \
            | grep -Ev '^src/error_codes.cpp$' \
            | while read -r file; do clang-tidy --quiet "$file" -- $common_args; done

  sanitizers:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '7.4'
            sanitizer: ubsan
          - php-version: '8.0'
            sanitizer: ubsan
          - php-version: '8.1'
            sanitizer: asan
          - php-version: '8.2'
            sanitizer: asan
          - php-version: '8.3'
            sanitizer: asan
          - php-version: '8.4'
            sanitizer: asan
          - php-version: '8.5'
            sanitizer: asan

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Checkout clickhouse-cpp
        run: |
          git submodule sync --recursive
          for attempt in 1 2 3; do
            if git submodule update --init --force --depth=1 --recursive; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          git submodule update --init --force --depth=1 --recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build sanitizer PHP and extension image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/ci/Dockerfile.sanitizer
          load: true
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            SANITIZER=${{ matrix.sanitizer }}
          cache-from: type=gha,scope=ext-clickhouse-sanitizer-${{ matrix.php-version }}
          cache-to: type=gha,mode=max,scope=ext-clickhouse-sanitizer-${{ matrix.php-version }}
          tags: clickhouse-sanitizer:${{ matrix.php-version }}

      - name: Run sanitizer tests
        run: |
          timeout 180s docker run --rm --network host \
            "clickhouse-sanitizer:${{ matrix.php-version }}"

  time64-386:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Checkout clickhouse-cpp
        run: |
          git submodule sync --recursive
          for attempt in 1 2 3; do
            if git submodule update --init --force --depth=1 --recursive; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          git submodule update --init --force --depth=1 --recursive

      - name: Run current 32-bit Time64 proof
        run: tools/32bit-time64.sh

      - name: Upload 32-bit Time64 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ext-clickhouse-time64-i386
          path: ../evidence/time64-build-*
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Checkout clickhouse-cpp
        run: |
          git submodule sync --recursive
          for attempt in 1 2 3; do
            if git submodule update --init --force --depth=1 --recursive; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          git submodule update --init --force --depth=1 --recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: phpize
          coverage: none

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lcov

      - name: Build extension with coverage
        run: |
          phpize
          coverage_flags="--coverage -O0 -g"
          CFLAGS="$coverage_flags" \
          CXXFLAGS="$coverage_flags" \
          LDFLAGS="--coverage" \
            ./configure --enable-clickhouse
          make -j"$(nproc)"

      - name: Run tests
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: '9000'
        run: |
          TEST_PHP_EXECUTABLE="$(command -v php)" \
            php -n run-tests.php -n -d extension=modules/clickhouse.so --show-diff -q tests/*.phpt

      - name: Generate coverage report
        run: |
          lcov --capture --directory . --output-file coverage.raw.info
          lcov --extract coverage.raw.info "$(pwd)/*.cpp" "$(pwd)/src/*" --output-file coverage.info
          genhtml coverage.info --output-directory coverage-html

      - name: Publish coverage summary
        run: |
          {
            echo "### C/C++ coverage"
            echo
            echo '```text'
            lcov --summary coverage.info 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ext-clickhouse-coverage
          path: |
            coverage.info
            coverage-html/

  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Checkout clickhouse-cpp
        run: |
          git submodule sync --recursive
          for attempt in 1 2 3; do
            if git submodule update --init --force --depth=1 --recursive; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          git submodule update --init --force --depth=1 --recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phpize
          coverage: none

      - name: Build extension
        run: |
          phpize
          ./configure --enable-clickhouse
          make -j$(nproc)

      - name: Run unit tests
        run: |
          TEST_PHP_EXECUTABLE=$(which php) \
            php -n run-tests.php -n -d extension=modules/clickhouse.so \
            --show-diff -q tests/0*.phpt

      - name: Run integration tests
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: '9000'
        run: |
          TEST_PHP_EXECUTABLE=$(which php) \
            php -n run-tests.php -n -d extension=modules/clickhouse.so \
            --show-diff -q tests/1*.phpt
