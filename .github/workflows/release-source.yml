name: Release Source Package

on:
  push:
    tags: ['v*']

permissions:
  contents: read # checkout the repository; the package job widens this

jobs:
  package-source:
    runs-on: ubuntu-latest
    permissions:
      actions: read # confirm CI succeeded for the tagged commit
      contents: write # publish the source package to the GitHub release

    steps:
      - name: Verify tag commit is on main and CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ahead="$(gh api --jq '.ahead_by' "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}")"
          if [ "$ahead" != "0" ]; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not contained in main"
            exit 1
          fi
          success="$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml --limit 50 \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          if [ "$success" -lt 1 ]; then
            echo "::error::CI workflow has not succeeded for ${GITHUB_SHA}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Checkout clickhouse-cpp
        run: |
          git submodule sync --recursive
          for attempt in 1 2 3; do
            if git submodule update --init --force --depth=1 --recursive; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          git submodule update --init --force --depth=1 --recursive

      - name: Build PIE source package
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_dir="clickhouse-$version"
          rm -rf dist
          mkdir -p "dist" "$RUNNER_TEMP/$package_dir"
          tar \
            --exclude-vcs \
            --exclude='./autom4te.cache' \
            --exclude='./modules' \
            --exclude='./.libs' \
            --exclude='./dist' \
            --exclude='./config.h' \
            --exclude='./config.log' \
            --exclude='./config.nice' \
            --exclude='./config.status' \
            --exclude='./configure' \
            --exclude='./configure~' \
            --exclude='./libtool' \
            --exclude='./Makefile' \
            --exclude='./Makefile.fragments' \
            --exclude='./Makefile.objects' \
            --exclude='./run-tests.php' \
            -cf - . | tar -xf - -C "$RUNNER_TEMP/$package_dir"
          tar -C "$RUNNER_TEMP" -czf "dist/php_clickhouse-$version-src.tgz" "$package_dir"

      - name: Upload source package
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/php_clickhouse-*-src.tgz
