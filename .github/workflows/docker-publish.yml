name: Docker Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read # checkout the repository

env:
  REGISTRY: ghcr.io

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    permissions:
      actions: read # confirm CI succeeded for the tagged commit
      contents: read # compare the tag commit against main

    steps:
      - name: Verify tag commit is on main and CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ahead="$(gh api --jq '.ahead_by' "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}")"
          if [ "$ahead" != "0" ]; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not contained in main"
            exit 1
          fi
          success="$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml --limit 50 \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          if [ "$success" -lt 1 ]; then
            echo "::error::CI workflow has not succeeded for ${GITHUB_SHA}"
            exit 1
          fi

  publish:
    needs: verify-tag
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    permissions:
      actions: write # GitHub Actions cache for the image build
      contents: read # checkout the repository
      packages: write # push images to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Checkout clickhouse-cpp
        run: |
          git submodule sync --recursive
          for attempt in 1 2 3; do
            if git submodule update --init --force --depth=1 --recursive; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          git submodule update --init --force --depth=1 --recursive

      - name: Set image name
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          IMAGE_NAME="${REGISTRY}/${REPO,,}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: PHP_VERSION=${{ matrix.php-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.meta.outputs.image }}:php${{ matrix.php-version }}-${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:php${{ matrix.php-version }}-latest
